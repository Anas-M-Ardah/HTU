<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="../css/signIn.css">
    <link rel="stylesheet" href="../css/modal.css">
</head>

<body>
    <div class="signin-container">
        <div class="signin-header">
            <h1>Sign In</h1>
            <p>Welcome back! Please sign in to continue.</p>
        </div>

        <form action="/signin" method="POST">
            <div class="form-group">
                <label for="identifier">Email or Username</label>
                <input type="text" id="identifier" name="identifier" placeholder="Enter your email or username"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required
                        class="password-input">
                    <span class="password-toggle" onclick="togglePassword(this)">
                        <i class="fas fa-eye" id="togglePassword"></i>
                    </span>
                </div>
            </div>

            <button type="button" id="signin-button" class="signin-button">Sign In</button>

            <div class="forgot-password">
                <a href="/forgot-password">Forgot Password?</a>
            </div>

            <!-- Modal HTML -->
            <div id="notification-modal" class="modal" style="display: none;">
                <div class="modal-content">
                    <span class="close-modal">&times;</span>
                    <div id="modal-icon"></div>
                    <h2 id="modal-title"></h2>
                    <p id="modal-message"></p>
                </div>
            </div>

            <div id="loader" class="loader-container" style="display: none;">
                <div class="loader">
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>

        </form>
    </div>
    <script src="../js/modal.js"></script>
    <script src="../js/signIn.js"></script>
</body>

</html>
