<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/tech.css">
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/loader.css">
    <title>Hours</title>
</head>

<body>
    <header>
        <img src="/images/HTU Logo200.png" alt="HTU logo">
        <nav>
            <a href="/html/tech.html">Technical</a>
            <a href="/html/eng.html">English</a>
            <a href="/html/soft.html">SoftSkills</a>
        </nav>
    </header>

    <!-- Table with course name and hours taken, hours remaining, total hours, and progress bar -->

    <main class="main-container">
        <table class="course-table">
            <thead class="course-table__header">
                <tr class="course-table__row">
                    <th class="course-table__cell">Course</th>
                    <th class="course-table__cell">Hours Taken</th>
                    <th class="course-table__cell">Hours Remaining</th>
                    <th class="course-table__cell">Total Hours</th>
                    <th class="course-table__cell">Progress Bar</th>
                    <th class="course-table__cell">Last Updated On</th>
                </tr>
            </thead>
            <tbody class="course-table__body">
                <!-- Table rows would follow the same pattern -->
                <tr class="course-table__row course-table__row--odd">
                    <td class="course-table__cell">...</td>
                </tr>
                <tr class="course-table__row course-table__row--even">
                    <td class="course-table__cell">...</td>
                </tr>
            </tbody>
        </table>
        
        <div id="loader" class="loader-container" style="display: none;">
            <div class="loader-wrapper">
                <div class="loader"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Hours. All rights reserved.</p>
    </footer>
    <script src="/js/index.js"></script>
</body>

</html>
