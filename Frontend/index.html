<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Frontend/css/tech.css">
    <link rel="stylesheet" href="/Frontend/css/index.css">
    <link rel="stylesheet" href="/Frontend/css/loader.css">
    <title>Hours</title>
</head>

<body>
    <header>
        <img src="/Frontend/images/HTU Logo200.png" alt="HTU logo">
        <nav>
            <a href="/Frontend/html/tech.html">Technical</a>
            <a href="/Frontend/html/eng.html">English</a>
            <a href="/Frontend/html/soft.html">SoftSkills</a>
        </nav>
    </header>
    <main>
        <!-- Table with course name and hours taken, hours remaining, total hours, and progress bar -->
        <table>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Hours Taken</th>
                    <th>Hours Remaining</th>
                    <th>Total Hours</th>
                    <th>Progress Bar</th>
                    <th>Last Updated On</th>
                </tr>
            </thead>
            <tbody>
                <!-- Table rows for each course -->
            </tbody>
        </table>

        <div id="loader" class="loader-container" style="display: none;">
            <div class="loader-wrapper">
                <div class="loader"></div>
            </div>
        </div>

    </main>
    <footer>
        <p>&copy; 2025 Hours. All rights reserved.</p>
    </footer>
    <script src="/Frontend/js/index.js"></script>
</body>

</html>
